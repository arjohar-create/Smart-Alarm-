name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Versions
        run: |
          sed -i 's/agp = "9.1.1"/agp = "8.6.1"/' gradle/libs.versions.toml || true
          sed -i 's/kotlin = "2.2.10"/kotlin = "2.0.21"/' gradle/libs.versions.toml || true

      - name: Build APK without gradlew
        run: |
          ls -la
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Simple-Alarm-APK
          path: "**/app-debug.apk"
